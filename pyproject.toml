[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "router9-python"
version = "0.1.0"
description = "Python migration of 9router"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
9router = "pyrouter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests_py"]
pythonpath = ["."]
asyncio_mode = "auto"
